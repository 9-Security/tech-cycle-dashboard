<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tech Cycle — Validation</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body data-i18n-title="val.title">
  <header class="topbar">
    <h1 data-i18n="val.title">Tech Cycle — Validation</h1>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html" data-i18n="nav.backtest">Backtest</a>
      <a class="active" href="validation.html" data-i18n="nav.validation">Validation</a>
      <a href="signals.html" data-i18n="nav.signals">Signals</a>
      <a href="risk.html" data-i18n="nav.risk">Risk</a>
      <a href="stocks.html" data-i18n="nav.stocks">Stocks</a>
      <a href="scenarios.html" data-i18n="nav.scenarios">Scenarios</a>
    </nav>
  </header>
  <div class="subbar" id="asof-line" data-i18n="common.loading">Loading…</div>
  <div class="banner" id="banner" data-i18n="common.loadingStatus">Loading data status…</div>

  <main>
    <section class="panel">
      <h2 data-i18n="val.models.h2"></h2>
      <div class="table-wrap"><table id="modelTable"></table></div>
      <p class="note" id="designNote"></p>
    </section>

    <section class="panel">
      <h2><span data-i18n="val.promo.h2"></span> (<a href="https://github.com/9-Security/tech-cycle-dashboard/blob/main/docs/model-promotion.md" data-i18n="val.promo.doc">docs/model-promotion.md</a>)</h2>
      <p class="interp" id="promoState">—</p>
      <div class="table-wrap"><table id="promoTable"></table></div>
      <p class="note" data-i18n="val.promo.note"></p>
    </section>

    <section class="panel" id="xmPanel" hidden>
      <h2 data-i18n="xm.h2">Out-of-domain test — frozen v3 design on 9 other markets (pre-registered)</h2>
      <p class="interp" id="xmVerdict">—</p>
      <div class="table-wrap"><table id="xmCrit"></table></div>
      <div class="table-wrap"><table id="xmTable"></table></div>
      <p class="note" data-i18n="xm.note"></p>
    </section>

    <div class="model-pick" id="modelPick" role="tablist">
      <span class="muted small" data-i18n="val.pick.label">Details for:</span>
      <button class="active" data-model="regime_v2" data-i18n="val.pick.v2">v2 regime (live)</button>
      <button data-model="tilt_v3" data-i18n="val.pick.v3">v3 candidate</button>
    </div>

    <section class="interp" id="summary" data-i18n="common.loading">Loading…</section>

    <section class="panel">
      <h2 data-i18n="val.cmp.h2"></h2>
      <div class="table-wrap"><table id="cmpTable"></table></div>
    </section>

    <section class="panel">
      <h2 data-i18n="val.stats.h2"></h2>
      <div class="metrics" id="stats"></div>
      <p class="note" data-i18n-html="val.stats.note"></p>
    </section>

    <section class="panel">
      <h2 data-i18n="val.valin.h2"></h2>
      <div class="table-wrap"><table id="valTable"></table></div>
      <p class="note" data-i18n="val.valin.note"></p>
    </section>

    <section class="panel">
      <h2 data-i18n="val.abl.h2"></h2>
      <div class="table-wrap"><table id="ablTable"></table></div>
    </section>

    <section class="panel">
      <h2 data-i18n-html="val.sub.h2"></h2>
      <div class="table-wrap"><table id="subTable"></table></div>
    </section>

    <section class="panel">
      <h2 data-i18n="val.sens.h2"></h2>
      <p class="note" id="sensNote"></p>
      <div class="table-wrap"><table id="heat" class="heat"></table></div>
    </section>

    <section class="panel">
      <h2 data-i18n="val.folds.h2"></h2>
      <div class="table-wrap"><table id="foldTable"></table></div>
    </section>

    <section class="panel">
      <h2 data-i18n-html="val.dq.h2"></h2>
      <div class="table-wrap"><table id="dqTable"></table></div>
      <div class="table-wrap"><table id="srcTable"></table></div>
    </section>
  </main>

  <footer id="footer" data-i18n="common.loading">Loading…</footer>
  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script src="js/validation.js"></script>
</body>
</html>

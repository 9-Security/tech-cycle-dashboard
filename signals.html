<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tech Cycle — Signals</title>
  <link rel="stylesheet" href="css/app.css" />
  <script src="static/chart.umd.min.js"></script>
</head>
<body data-i18n-title="sig.title">
  <header class="topbar">
    <h1 data-i18n="sig.title">Tech Cycle — Signals</h1>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html" data-i18n="nav.backtest">Backtest</a>
      <a href="validation.html" data-i18n="nav.validation">Validation</a>
      <a class="active" href="signals.html" data-i18n="nav.signals">Signals</a>
      <a href="risk.html" data-i18n="nav.risk">Risk</a>
      <a href="scenarios.html" data-i18n="nav.scenarios">Scenarios</a>
    </nav>
  </header>
  <div class="subbar" id="asof-line" data-i18n="common.loading">Loading…</div>
  <div class="banner" id="banner" data-i18n="common.loadingStatus">Loading data status…</div>

  <main>
    <section class="interp" id="summary" data-i18n="common.loading">Loading…</section>

    <section class="panel">
      <h2 data-i18n="sig.verdict.h2"></h2>
      <div class="table-wrap"><table id="verdictTable"></table></div>
      <p class="note" data-i18n-html="sig.verdict.note"></p>
    </section>

    <section class="panel">
      <h2 data-i18n="sig.q.h2">Quintile profile</h2>
      <label class="picker"><span data-i18n="sig.q.pick">Signal</span> <select id="sigPick"></select></label>
      <div class="chart-wrap"><canvas id="bucketChart"></canvas></div>
    </section>

    <section class="panel">
      <h2 data-i18n="sig.sc.h2"></h2>
      <div class="chart-wrap"><canvas id="scatterChart"></canvas></div>
      <p class="note" data-i18n="sig.sc.note"></p>
    </section>

    <section class="panel">
      <h2 data-i18n="sig.ic.h2"></h2>
      <div class="table-wrap"><table id="icTable"></table></div>
      <p class="note" data-i18n-html="sig.ic.note"></p>
    </section>

    <section class="panel">
      <h2 data-i18n="sig.era.h2"></h2>
      <div class="table-wrap"><table id="eraTable"></table></div>
    </section>

    <section class="panel">
      <h2 data-i18n="sig.thr.h2"></h2>
      <div class="table-wrap"><table id="thrTable"></table></div>
    </section>
  </main>

  <footer id="footer" data-i18n="common.loading">Loading…</footer>
  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script src="js/signals.js"></script>
</body>
</html>

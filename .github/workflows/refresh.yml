name: Daily refresh & deploy

on:
  schedule:
    # 22:15 UTC Mon-Fri: after the US close (20:00/21:00 UTC) so the day's bar exists.
    - cron: "15 22 * * 1-5"
    # 07:07 UTC Mon-Fri = 15:07 Taiwan time: after the TWSE close (13:30) so the day's bar
    # exists. Refreshes ONLY the Taiwan stocks on the Stocks page (see "Choose scope").
    - cron: "7 7 * * 1-5"
    # Backups: GitHub can delay or drop a scheduled run. Each backup runs only if
    # its primary did not publish after that market's close (see job "gate").
    - cron: "41 23 * * 1-5"   # backup of 22:15 (full)
    - cron: "37 8 * * 1-5"    # backup of 07:07 (Taiwan stocks)
  workflow_dispatch:
    inputs:
      scope:
        description: "full = everything (US close run); tw = Taiwan stocks only"
        type: choice
        options: [full, tw]
        default: full
      allow_intraday:
        description: "Publish even if the market session is still open (unfinished bar). Normally leave off."
        type: boolean
        default: false
      pit_check:
        description: "Also run the weekly look-ahead (point-in-time) check now"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

# Least privilege: each job declares only what it needs.
permissions: {}

# Concurrency is per job, not per workflow. GitHub cancels a *pending* run when
# a newer one joins the same group, so a shared group let a push-triggered
# redeploy cancel a queued scheduled refresh. Data refreshes now queue only
# among themselves, and Pages deploys only among themselves (a newer deploy
# replacing a pending older one is harmless: every build checks out the latest
# main, data included).

jobs:
  gate:
    # A backup schedule runs only if the data were not already published after
    # the market's close today (full: health.json as_of >= 21:00 UTC; Taiwan:
    # stocks.json run_issues.TW.as_of >= 06:00 UTC). Every other trigger runs.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: data
      - name: Skip a backup whose primary already published
        id: check
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$EVENT_SCHEDULE" in
            "41 23 * * 1-5") KIND=full ;;
            "37 8 * * 1-5") KIND=tw ;;
            *) echo "run=yes" >> "$GITHUB_OUTPUT"; echo "not a backup schedule: run"; exit 0 ;;
          esac
          RUN=$(KIND="$KIND" python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          kind = os.environ["KIND"]
          now = datetime.now(timezone.utc)
          cutoff = now.replace(hour=21 if kind == "full" else 6, minute=0, second=0, microsecond=0)
          try:
              if kind == "full":
                  stamp = json.load(open("data/health.json")).get("as_of")
              else:
                  stamp = ((json.load(open("data/stocks.json")).get("run_issues") or {}).get("TW") or {}).get("as_of")
              done = datetime.strptime(stamp, "%Y%m%dT%H%M%SZ").replace(tzinfo=timezone.utc) >= cutoff
          except Exception:  # noqa: BLE001 - unreadable state: run the backup
              done = False
          print("no" if done else "yes")
          PY
          )
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "backup ($KIND): run=$RUN"

  refresh:
    # Pushes only redeploy; data refresh runs on schedule / manual dispatch.
    needs: gate
    if: github.event_name != 'push' && needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: data-refresh
      cancel-in-progress: false
    permissions:
      contents: write  # commit refreshed data/
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      pit: ${{ steps.pit.outcome }}
      pit_ran: ${{ steps.pit.outputs.ran }}
      archive: ${{ steps.archive.outcome }}
      archive_ran: ${{ steps.archive.outputs.ran }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Do not leave the write token in .git/config while third-party code
          # (pip install, tests, the engine) runs; it is used only in the push step.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements-dev.lock
      - name: Install (pinned versions, hash-checked)
        run: pip install --require-hashes -r engine/requirements-dev.lock
      - name: Unit tests (look-ahead / lag-1 guards)
        working-directory: engine
        run: python -m pytest -q tests
      - name: Choose scope
        id: scope
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$EVENT_SCHEDULE" = "7 7 * * 1-5" ] || [ "$EVENT_SCHEDULE" = "37 8 * * 1-5" ] || [ "$INPUT_SCOPE" = "tw" ]; then
            echo "scope=tw" >> "$GITHUB_OUTPUT"
          else
            echo "scope=full" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh Taiwan stocks only
        if: steps.scope.outputs.scope == 'tw'
        working-directory: engine
        env:
          ALLOW_INTRADAY: ${{ inputs.allow_intraday }}
          RAW_ARCHIVE_ENABLED: ${{ secrets.R2_ACCESS_KEY_ID != '' && '1' || '' }}
        run: |
          FLAG=""; if [ "$ALLOW_INTRADAY" = "true" ]; then FLAG="--allow-intraday"; fi
          python -m tcd stocks --market TW --out ../data --cache .cache/raw $FLAG
      - name: Refresh data (fail-closed)
        if: steps.scope.outputs.scope == 'full'
        working-directory: engine
        env:
          # Repository SECRET (not a variable): "<org or app name> <contact email>" for the SEC
          # fair-access policy. Secrets are masked in logs; variables are printed in plain text,
          # which is public for a public repository. If unset, a generic agent without contact
          # details is used.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALLOW_INTRADAY: ${{ inputs.allow_intraday }}
          RAW_ARCHIVE_ENABLED: ${{ secrets.R2_ACCESS_KEY_ID != '' && '1' || '' }}
        run: |
          FLAG=""; if [ "$ALLOW_INTRADAY" = "true" ]; then FLAG="--allow-intraday"; fi
          python -m tcd refresh --out ../data --cache .cache/raw $FLAG
      - name: Weekly look-ahead (point-in-time) check on real data
        # Monday's full run, or on request. Truncates the raw data at many dates and
        # checks that history never changes when later data arrive (the bug class
        # found in the first code review). Does not block publishing; notify opens
        # an issue labelled pit-check-failure when it fails.
        id: pit
        if: steps.scope.outputs.scope == 'full' && (inputs.pit_check || (github.event_name == 'schedule' && (github.event.schedule == '15 22 * * 1-5' || github.event.schedule == '41 23 * * 1-5')))
        continue-on-error: true
        working-directory: engine
        env:
          PIT_INPUT: ${{ inputs.pit_check }}
        run: |
          if [ "$PIT_INPUT" != "true" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "ran=no" >> "$GITHUB_OUTPUT"; echo "not Monday: skipped"; exit 0
          fi
          echo "ran=yes" >> "$GITHUB_OUTPUT"
          python tools/check_pit.py --cache .cache/raw --every 6ME --start 2008-01-15
      - name: Archive raw inputs to private R2
        # Every raw response this run used, content-addressed (blobs/<sha256>.gz,
        # the hashes the published manifests record) plus an index
        # runs/<run>-<attempt>-<scope>.json; tools/restore_raw.py rebuilds a cache
        # from it. Private bucket: the vendor data is not redistributed. Skipped
        # (not failed) until the R2 secrets exist; never blocks publishing.
        id: archive
        if: always() && steps.scope.outcome == 'success'
        continue-on-error: true
        working-directory: engine
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'tech-cycle-raw' }}
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: python tools/archive_raw.py --cache .cache/raw --scope "$SCOPE" --feed .cache/range_feed/full.json
      - name: Validate outputs before commit
        working-directory: engine
        run: python tools/validate_data.py --data ../data --base-ref HEAD
      - name: Commit refreshed data
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          if [ "$SCOPE" = "tw" ]; then
            git commit -m "data: Taiwan stocks refresh $(date -u +%Y-%m-%d)"
          else
            git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
          fi
          # Token passed as an HTTP header per command (not in the URL: a URL
          # argument would be recorded in .git/logs by git pull).
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          URL="https://github.com/${REPO}.git"
          for i in 1 2 3; do
            if git -c http.extraheader="$AUTH" pull --rebase "$URL" main; then
              # Re-validate after the rebase: the merged files must still be valid
              # and the ledger still append-only against the new base.
              (cd engine && python tools/validate_data.py --data ../data --base-ref HEAD~1) || exit 1
              git -c http.extraheader="$AUTH" push "$URL" HEAD:main && exit 0
            else
              git rebase --abort || true
            fi
            sleep $((i * 10))
          done
          exit 1

  build:
    needs: refresh
    # Build after a successful refresh, or on push (refresh skipped).
    # A failed refresh skips build and deploy, so the site keeps the last good data.
    # A backup schedule skipped by the gate does not redeploy.
    if: always() && (needs.refresh.result == 'success' || (needs.refresh.result == 'skipped' && github.event_name == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # includes the data commit pushed by the refresh job
          persist-credentials: false
      - name: Stage static site
        run: |
          mkdir -p _site
          cp -r index.html validation.html signals.html risk.html stocks.html scenarios.html css js static data _site/
          touch _site/.nojekyll
          # Cache-busting: Pages lets browsers cache assets (~10 min). Version every
          # local js/css/static URL with the deployed commit so a new page never
          # runs against a stale cached script.
          V=$(git rev-parse --short=12 HEAD)
          sed -i -E "s#(src|href)=\"((js|css|static)/[^\"?]+)\"#\1=\"\2?v=${V}\"#g" _site/*.html
          grep -c "?v=${V}" _site/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Separate job: the artifact is finalized before deploy starts, and
    # re-running a failed deploy does not upload a duplicate artifact.
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
      actions: read  # deploy-pages reads the run's artifact metadata
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    # Report the run's state as GitHub issues (the owner is notified of new
    # issues and comments by default): failure -> open / comment, success ->
    # close. Report-only components that failed get their own "degraded"
    # issue. Labels are per scope (full / tw); the scope is derived from the
    # trigger here, so it is right even when the refresh job died before its
    # own scope step. A success closes an issue only if the issue has had no
    # activity since this run started (an older run finishing late cannot
    # close a newer failure). Notify jobs run one at a time.
    needs: [gate, refresh, build, deploy]
    # Runs unless the gate decided to skip a backup (a failed gate is reported).
    if: always() && github.event_name != 'push' && needs.gate.outputs.run != 'no'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: notify
      cancel-in-progress: false
    permissions:
      issues: write
      contents: read
      actions: read  # this run's start time
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # latest data, including this run's commit
          persist-credentials: false
      - name: Report run state as issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          R_GATE: ${{ needs.gate.result }}
          R_REFRESH: ${{ needs.refresh.result }}
          R_BUILD: ${{ needs.build.result }}
          R_DEPLOY: ${{ needs.deploy.result }}
          R_PIT: ${{ needs.refresh.outputs.pit }}
          R_PIT_RAN: ${{ needs.refresh.outputs.pit_ran }}
          R_ARCHIVE: ${{ needs.refresh.outputs.archive }}
          R_ARCHIVE_RAN: ${{ needs.refresh.outputs.archive_ran }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SCOPE: ${{ inputs.scope }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$EVENT_SCHEDULE" = "7 7 * * 1-5" ] || [ "$EVENT_SCHEDULE" = "37 8 * * 1-5" ] || [ "$INPUT_SCOPE" = "tw" ]; then SCOPE=tw; else SCOPE=full; fi
          RUN_STARTED=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq '.run_started_at')
          export RUN_STARTED
          today=$(date -u +%Y-%m-%d)
          failed=""
          for j in "gate:$R_GATE" "refresh:$R_REFRESH" "build:$R_BUILD" "deploy:$R_DEPLOY"; do
            case "${j#*:}" in failure|cancelled) failed="$failed ${j%%:*} (${j#*:})" ;; esac
          done
          # Weekly look-ahead check (only reported when it actually ran).
          if [ "$R_PIT_RAN" = "yes" ] && [ "$R_PIT" = "failure" ]; then
            bash .github/scripts/notify.sh "pit-check-failure" fail "Look-ahead (point-in-time) check failed" \
              "Run $RUN_URL ($today): later data changed earlier months of the panel (see the step log for the cutoffs and columns). Published numbers may contain look-ahead. Closes itself after the next passing check."
          elif [ "$R_PIT_RAN" = "yes" ] && [ "$R_PIT" = "success" ]; then
            bash .github/scripts/notify.sh "pit-check-failure" ok "" "Check passed in run $RUN_URL ($today)."
          fi
          # Raw-input archive (only reported once configured).
          if [ "$R_ARCHIVE" = "failure" ]; then
            bash .github/scripts/notify.sh "raw-archive-failure" fail "Raw-input archive to R2 failed" \
              "Run $RUN_URL ($today): the raw inputs of this run were not (fully) archived; published numbers are unaffected, but this run cannot be recomputed from the archive. Closes itself after the next successful archive."
          elif [ "$R_ARCHIVE_RAN" = "yes" ] && [ "$R_ARCHIVE" = "success" ]; then
            bash .github/scripts/notify.sh "raw-archive-failure" ok "" "Archive succeeded in run $RUN_URL ($today)."
          fi
          # Risk alerts of THIS run (section 21): one comment on the open
          # risk-alert issue; the issue is never closed automatically.
          if [ "$SCOPE" = "full" ]; then
            abody=$(PYTHONPATH=engine python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from tcd.alerts import describe
          started = datetime.fromisoformat(os.environ["RUN_STARTED"].replace("Z", "+00:00"))
          try:
              a = json.load(open("data/alerts.json"))
              fresh = datetime.strptime(a.get("as_of", ""), "%Y%m%dT%H%M%SZ").replace(tzinfo=timezone.utc) >= started
              ev = (a.get("events") or []) if fresh else []
              print("\n".join(describe(e) for e in ev))
          except Exception:  # noqa: BLE001 - never let notify crash on a status file
              pass
          PY
            )
            if [ -n "$abody" ]; then
              LABEL_COLOR=fbca04 bash .github/scripts/notify.sh "risk-alert" fail "Risk alerts (market)" \
                "$(printf 'Run %s (%s):\n%s\n\nRules: methodology section 21. Not a trade signal.' "$RUN_URL" "$today" "$abody")"
            else
              echo "no risk alerts in this run"
            fi
          fi
          if [ -n "$failed" ]; then
            bash .github/scripts/notify.sh "refresh-failure-$SCOPE" fail "Data refresh ($SCOPE) failed" \
              "Run $RUN_URL ($today) did not complete:$failed. A cancelled job can mean a newer queued run replaced it; check the run. If refresh failed nothing was committed; if only build/deploy failed, the data commit is on main but the site was not redeployed by this run. Closes itself after the next successful $SCOPE run."
            exit 0
          fi
          # Report-only components that failed in THIS run (names only). Status
          # files older than this run (e.g. a Taiwan holiday run that wrote
          # nothing) are not evaluated.
          comps=$(SCOPE="$SCOPE" python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          scope = os.environ["SCOPE"]
          started = datetime.fromisoformat(os.environ["RUN_STARTED"].replace("Z", "+00:00"))
          def fresh(stamp):
              try:
                  return datetime.strptime(stamp, "%Y%m%dT%H%M%SZ").replace(tzinfo=timezone.utc) >= started
              except (TypeError, ValueError):
                  return False
          try:
              if scope == "full":
                  h = json.load(open("data/health.json"))
                  names = [str(i.get("component", "unknown")) for i in (h.get("report_issues") or [])] if fresh(h.get("as_of")) else ["-"]
              else:
                  run = ((json.load(open("data/stocks.json")).get("run_issues") or {}).get("TW") or {})
                  names = [str(i.get("component", "unknown")) for i in (run.get("issues") or [])] if fresh(run.get("as_of")) else ["-"]
          except Exception:  # noqa: BLE001 - never let notify crash on a status file
              names = ["status-file-unreadable"]
          print(" ".join(sorted(set(names))))
          PY
          )
          bash .github/scripts/notify.sh "refresh-failure-$SCOPE" ok "" "Recovered: run $RUN_URL ($today) succeeded."
          if [ "$comps" = "-" ]; then
            echo "status file not written by this run (e.g. no new bar): degraded state unchanged"
          elif [ -n "$comps" ]; then
            bash .github/scripts/notify.sh "refresh-degraded-$SCOPE" fail "Data refresh ($SCOPE): report-only components failed" \
              "Run $RUN_URL ($today) published, but these report-only components were not updated: $comps. Their previous results stay on the site, marked in the banner. Closes itself when a $SCOPE run has no such failures."
          else
            bash .github/scripts/notify.sh "refresh-degraded-$SCOPE" ok "" "Recovered: run $RUN_URL ($today) had no report-only failures."
          fi

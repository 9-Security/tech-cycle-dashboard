<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tech Cycle — Scenarios</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body data-i18n-title="sc.title">
  <header class="topbar">
    <h1 data-i18n="sc.title">Tech Cycle — Scenarios</h1>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html" data-i18n="nav.backtest">Backtest</a>
      <a href="validation.html" data-i18n="nav.validation">Validation</a>
      <a href="signals.html" data-i18n="nav.signals">Signals</a>
      <a href="risk.html" data-i18n="nav.risk">Risk</a>
      <a href="stocks.html" data-i18n="nav.stocks">Stocks</a>
      <a class="active" href="scenarios.html" data-i18n="nav.scenarios">Scenarios</a>
    </nav>
  </header>
  <div class="subbar" id="asof-line" data-i18n="common.loading">Loading…</div>
  <div class="banner" id="banner" data-i18n="common.loadingStatus">Loading data status…</div>

  <main>
    <section class="metrics">
      <div class="card"><div class="label" data-i18n="sc.card.regime">Official regime</div><div class="value" id="m-regime">—</div><div class="sub" id="m-regime-sub">—</div></div>
      <div class="card"><div class="label" data-i18n="sc.card.weight">Weight in force</div><div class="value" id="m-weight">—</div><div class="sub" id="m-weight-sub">—</div></div>
      <div class="card"><div class="label" data-i18n="sc.card.prov">Month-to-date</div><div class="value" id="m-prov">—</div><div class="sub" id="m-prov-sub">—</div></div>
      <div class="card"><div class="label" data-i18n="sc.card.fit">Params fit for</div><div class="value" id="m-fit">—</div><div class="sub" data-i18n="sc.card.fitSub">walk-forward, data through prior Dec</div></div>
    </section>

    <section class="interp" id="interpretation" data-i18n="common.loading">Loading…</section>

    <section class="panel">
      <h2 data-i18n="sc.trig.h2">Trigger distances</h2>
      <div class="table-wrap"><table id="trigTable"></table></div>
    </section>

    <section class="panel">
      <h2 data-i18n="sc.h2">Scenarios</h2>
      <div class="preview-grid" id="scenarioGrid"></div>
      <div class="disclaimer" id="disclaimer" data-i18n="common.disclaimer"></div>
    </section>
  </main>

  <footer id="footer" data-i18n="common.loading">Loading…</footer>
  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script src="js/scenarios.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tech Cycle — Stocks</title>
  <link rel="stylesheet" href="css/app.css" />
  <script src="static/chart.umd.min.js"></script>
</head>
<body data-i18n-title="st.title">
  <header class="topbar">
    <h1 data-i18n="st.title">Tech Cycle — Stocks</h1>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html" data-i18n="nav.backtest">Backtest</a>
      <a href="validation.html" data-i18n="nav.validation">Validation</a>
      <a href="signals.html" data-i18n="nav.signals">Signals</a>
      <a href="risk.html" data-i18n="nav.risk">Risk</a>
      <a class="active" href="stocks.html" data-i18n="nav.stocks">Stocks</a>
      <a href="scenarios.html" data-i18n="nav.scenarios">Scenarios</a>
    </nav>
  </header>
  <div class="subbar" id="asof-line" data-i18n="common.loading">Loading…</div>
  <div class="banner" id="banner" data-i18n="common.loadingStatus">Loading data status…</div>

  <main>
    <section class="interp" data-i18n="st.intro"></section>

    <div class="picker-row">
      <label class="picker"><span data-i18n="st.sort">Sort by</span>
        <select id="sortPick">
          <option value="list" data-i18n="st.sort.list">Watchlist order</option>
          <option value="light" data-i18n="st.sort.light">Risk light</option>
          <option value="vol" data-i18n="st.sort.vol">Next-day volatility</option>
          <option value="ret1m" data-i18n="st.sort.ret1m">1-month return</option>
          <option value="dd" data-i18n="st.sort.dd">Drop from 52-week high</option>
        </select>
      </label>
      <span class="muted small" data-i18n="st.click">Select a row for details.</span>
    </div>

    <section class="panel">
      <h2 data-i18n="st.us.h2">US mega-cap tech</h2>
      <p class="muted small" id="upd-us"></p>
      <div class="table-wrap"><table id="usTable" class="stock-table"></table></div>
    </section>

    <section class="panel">
      <h2 data-i18n="st.tw.h2">Taiwan AI supply chain</h2>
      <p class="muted small" id="upd-tw"></p>
      <p class="muted small" id="off-tw"></p>
      <div class="table-wrap"><table id="twTable" class="stock-table"></table></div>
    </section>

    <section class="panel" id="live">
      <h2 data-i18n="st.live.h2">Live track record (forecast ledger)</h2>
      <p class="muted small" data-i18n="st.live.intro"></p>
      <div class="table-wrap"><table id="liveTable"></table></div>
      <p class="muted small" id="live-note"></p>
    </section>

    <section class="panel light stock-detail" id="detail" hidden>
      <div class="light-head"><span class="light-dot" aria-hidden="true"></span><div>
        <div class="light-kicker" id="d-title">—</div>
        <h2 id="d-light">—</h2></div></div>
      <ul id="d-points"></ul>
      <div class="chart-wrap short"><canvas id="d-price"></canvas></div>
      <div class="chart-wrap short"><canvas id="d-ret"></canvas></div>
    </section>

    <div class="disclaimer" data-i18n="common.disclaimer"></div>
  </main>

  <footer id="footer" data-i18n="common.loading">Loading…</footer>
  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script src="js/stocks.js"></script>
</body>
</html>
